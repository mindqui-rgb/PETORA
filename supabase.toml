# Supabase CLI configuration for petshop-clinic
project_id = "petshop-clinic"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
# Shadow database for migrations
shadow_database = true

[db.pooler]
port = 54325

[auth]
enabled = true
# Auth settings
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true

[realtime]
enabled = true